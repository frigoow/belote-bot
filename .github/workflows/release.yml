name: Release

# Push a tag vX.Y.Z (matching versionName in app/belot-app/build.gradle.kts) and
# this builds the signed APK and publishes it as a GitHub release, then the
# desktop packages for Windows, macOS and Linux (desktop.yml) are attached to
# it. The networks come from the models release (MODELS_TAG); they are not in git.
#
# Signing: the secrets BELOT_KEYSTORE_B64, BELOT_KEYSTORE_PASSWORD,
# BELOT_KEY_ALIAS and BELOT_KEY_PASSWORD -- the Belot key, never another one,
# or updates stop installing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.2
        required: true

permissions:
  contents: write

env:
  MODELS_TAG: belot-models-v3
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ env.TAG }}

      - name: Tag matches the app version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/belot-app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::tag $TAG but versionName is $name -- bump app/belot-app/build.gradle.kts (versionName and versionCode)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "platforms;android-37.0" "ndk;30.0.16138531" "cmake;3.22.1"

      - name: Networks
        env:
          GH_TOKEN: ${{ github.token }}
        run: BELOT_MODELS_TAG=$MODELS_TAG app/fetch_models.sh

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BELOT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret BELOT_KEYSTORE_B64 is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BELOT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app
        env:
          BELOT_KEYSTORE_PASSWORD: ${{ secrets.BELOT_KEYSTORE_PASSWORD }}
          BELOT_KEY_ALIAS: ${{ secrets.BELOT_KEY_ALIAS }}
          BELOT_KEY_PASSWORD: ${{ secrets.BELOT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :belot-app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/belot-app/build/outputs/apk/release/belot-app-release.apk Belot.apk
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Belot.apk --clobber
          else
            gh release create "$TAG" Belot.apk --title "Belot $TAG" --generate-notes --latest
          fi

  desktop:
    needs: apk
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
